name: App
options:
  bundleIdPrefix: com.stewardoftheking
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: false
packages:
  Capacitor:
    path: ../vendor/capacitor-swift-pm
settings:
  base:
    DEVELOPMENT_TEAM: YY8Q4336XS
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Twic:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
          - "public"
          - "public/**"
          - "Bible"
          - "Bible/**"
      - path: App/public
        type: folder
        buildPhase: resources
      - path: App/Bible
        type: folder
        buildPhase: resources
      - path: ../../lib/scripture-refs.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Twic
        PRODUCT_MODULE_NAME: Twic
        PRODUCT_BUNDLE_IDENTIFIER: com.stewardoftheking.twic
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: Capacitor
        product: Capacitor
      - package: Capacitor
        product: Cordova
  TwicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TwicTests
      - path: ../fixtures
        buildPhase: resources
    dependencies:
      - target: Twic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stewardoftheking.twic.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Twic.app/Twic
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Twic:
    build:
      targets:
        Twic: all
        TwicTests: [test]
    test:
      targets:
        - TwicTests
    run:
      config: Debug
    archive:
      config: Release
